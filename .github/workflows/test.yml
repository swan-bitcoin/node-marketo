name: test

on:
  pull_request:
  push:
    branches: [swan-changes]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Node version core-api runs this library on
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
